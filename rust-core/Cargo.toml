[package]
name = "rustcore"
version = "0.1.0"
edition = "2024"

[lib]
name = "fluxcore"
crate-type = ["staticlib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# SHA-256 for account identity derivation; must match the Go core byte for
# byte. Pure Rust implementation with no transitive dependencies.
sha2 = "0.10"

[profile.release]
opt-level = 3
lto = true
