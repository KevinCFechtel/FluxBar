[package]
name = "rustcore"
version = "0.1.0"
edition = "2024"

[lib]
name = "fluxcore"
crate-type = ["staticlib", "rlib"]

[features]
default = []
# Mobile runtime proof operations. Not part of the production FluxBar ABI;
# gated so the probe code, extra request fields, and platform-verifier TLS
# configuration do not affect normal macOS builds.
mobile-runtime-proof = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# SHA-256 for account identity derivation; must match the Go core byte for
# byte. Pure Rust implementation with no transitive dependencies.
sha2 = "0.10"
rusqlite = { version = "0.37", features = ["bundled"] }
# Synchronous Miniflux HTTP client. Blocking API matches the synchronous core
# without an async runtime. The `tls` feature enables rustls; `native-certs`
# makes rustls load the OS/platform root store (macOS Security.framework on
# Apple platforms), preserving Go-like system-trust semantics. ureq 2.12's
# `native-tls` feature is an adapter that requires explicit AgentBuilder
# configuration, so rustls is the supported automatic backend.
ureq = { version = "2", features = ["tls", "native-certs"], default-features = false }
# Platform-native TLS certificate verification. Replaces rustls-native-certs on
# iOS/macOS (Security.framework) and Android (Trust Manager) while preserving
# Linux fallback behavior through rustls-native-certs. Used by the shared HTTP
# agent and by the mobile-runtime-proof HTTPS probe.
rustls-platform-verifier = "0.6"
# RFC3339Nano-compatible UTC timestamps for pending/Undo rows and sync state.
time = { version = "=0.3.41", features = ["formatting"] }
# HTML5 parser for Go-compatible article preview/image extraction (Phase 9.1).
# html5ever and markup5ever_rcdom are pure Rust; rcdom is a minimal reference
# DOM, not a browser engine.
html5ever = "0.39"
markup5ever_rcdom = "0.39"
# URL parsing/resolution. Already a transitive dependency of ureq; made
# explicit because article-image relative URL resolution is a core behavior.
url = "2"
# Image decoding/encoding for feed-icon normalization (Phase 9.3). Only the
# formats FluxBar actually encounters are enabled to keep binary size down.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "ico"] }
# SVG rasterization for feed icons. Default features are disabled; text
# rendering is omitted because feed icons rarely contain text and it avoids
# pulling in font databases. This is a documented semantic boundary.
resvg = { version = "0.48", default-features = false }
# base64 decoding of Miniflux icon data URLs. Pure Rust, no transitive deps.
base64 = "0.22"
# Lightweight logging facade. Business modules use `log::info!` etc.; the
# macOS backend routes records into Unified Logging. `release_max_level_info`
# compiles out debug/trace logs in release builds.
log = { version = "0.4", features = ["release_max_level_info"] }

[target.'cfg(target_os = "macos")'.dependencies]
# Minimal Unified Logging backend for the `log` facade on Apple platforms.
oslog = { version = "0.2", features = ["logger"] }

[dev-dependencies]
# Temporary directories for the mobile-runtime-proof SQLite tests.
tempfile = "3"

[profile.release]
opt-level = 3
lto = true
